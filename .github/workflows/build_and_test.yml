name: Pamplejuce

on:
  workflow_dispatch: # lets you run a build from the UI
  push:
  pull_request:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISPLAY: :0 # linux pluginval needs this
  CMAKE_BUILD_PARALLEL_LEVEL: 3 # Use up to 3 cpus to build juceaide, etc
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SOURCE_REV: ed19c2c16b57a6d94db391bea3ef4a80b769d5bf # v1.0.4, including its pinned JUCE
  # Large parameter banks need time for exhaustive state-restoration checks.
  PLUGINVAL_TIMEOUT_MS: 1800000
  SCCACHE_CACHE_MULTIARCH: 1
  SCCACHE_IGNORE_SERVER_IO_ERROR: 1
  # IPP_DIR is still defined, but the installation step is removed as it was likely broken.
  # If IPP is a hard requirement, you must find a modern way to install it.
  # If it's optional, your CMake should handle its absence gracefully.
  IPP_DIR: C:\Program Files (x86)\Intel\oneAPI\ipp\latest\lib\cmake\ipp

defaults:
  run:
    shell: bash

# jobs are run in paralell on different machines
# all steps run in series
jobs:
  build_and_test:
    # don't double run on PRs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            pluginval-binary: ./pluginval
            extra-flags: -G Ninja
          - name: macOS
            os: macos-15
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            pluginval-binary: ./pluginval.exe

    steps:
      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      # The hosted image already includes LLVM. setup-clang upgrades it through
      # Chocolatey, making every build depend on another large release download.
      - name: Use preinstalled Clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          foreach ($compiler in @('clang.exe', 'clang++.exe')) {
            $compilerPath = Join-Path $llvmBin $compiler
            if (!(Test-Path $compilerPath -PathType Leaf)) {
              throw "The runner image is missing its preinstalled compiler: $compilerPath"
            }
            & $compilerPath --version
            if ($LASTEXITCODE -ne 0) { throw "Compiler check failed: $compilerPath" }
          }
          $llvmBin >> $env:GITHUB_PATH
          'CC=clang' >> $env:GITHUB_ENV
          'CXX=clang++' >> $env:GITHUB_ENV

      # This also starts up our "fake" display Xvfb, needed for pluginval
      - name: Install JUCE's Linux Deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxi-dev libegl-dev libfreetype6-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev xvfb openbox x11-utils ninja-build
          # Avoid XShmAttach errors during rapid test-peer creation on Xvfb.
          # Use JUCE's normal XImage fallback on this CI display.
          /usr/bin/Xvfb "$DISPLAY" -screen 0 1920x1080x24 -nolisten tcp -extension MIT-SHM > "$RUNNER_TEMP/fire-xvfb.log" 2>&1 &
          for attempt in {1..40}; do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          xdpyinfo -display "$DISPLAY" > "$RUNNER_TEMP/fire-xdpyinfo.log"
          if grep -q 'MIT-SHM' "$RUNNER_TEMP/fire-xdpyinfo.log"; then
            echo "CI display unexpectedly enabled MIT-SHM" >&2
            exit 1
          fi
          # Native JUCE windows require EWMH atoms from a window manager.
          # A bare Xvfb server otherwise produces BadAtom test failures.
          openbox --sm-disable > "$RUNNER_TEMP/fire-openbox.log" 2>&1 &
          for attempt in {1..40}; do
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then break; fi
            sleep 0.25
          done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'

      # NOTE: The fragile, hardcoded IPP installation has been removed.
      # The build will now proceed without it. If IPP is a requirement,
      # you must implement a modern, reliable installation method here.
      # For example, using Intel's official command-line installer.

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then choco install ninja --yes --no-progress; fi
          ninja --version

      - name: Install macOS Deps
        if: ${{ matrix.name == 'macOS' }}
        run: |
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          ninja --version

      # Use the newest stable Xcode available on the selected runner image.
      - name: Use latest Xcode on system (macOS)
        if: ${{ matrix.name == 'macOS' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      # Caching is optional. Do not download sccache just to start compilation:
      # an outage must not fail either setup or an action's post-job cleanup.
      - name: Select available compiler cache
        run: |
          compiler_launcher=""
          if command -v sccache >/dev/null 2>&1 && sccache --start-server; then
            compiler_launcher="sccache"
          else
            echo "::notice::Compiler cache unavailable; building directly with the installed compiler."
          fi
          echo "FIRE_COMPILER_LAUNCHER=$compiler_launcher" >> "$GITHUB_ENV"

      # Resolve required validation tooling before spending time on the build.
      - name: Prepare pluginval
        run: |
          if ! bash tools/validation/download_pluginval.sh "${{ matrix.name }}"; then
            echo "::warning::Binary downloads unavailable; building the pinned pluginval source instead."
            bash tools/validation/build_pluginval.sh "${{ matrix.name }}"
          fi

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DFIRE_INSTALL_PLUGINS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER="$FIRE_COMPILER_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$FIRE_COMPILER_LAUNCHER" .

      - name: Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Test & Benchmarks
        id: tests
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          # Do not publish reports left over from an earlier local/cached run.
          rm -f test-layout-results.xml test-results.xml Testing/Temporary/LastTest.log Testing/Temporary/LastTestsFailed.log
          # Check UI teardown and platform-sensitive layouts before the longer DSP/state suite.
          ui_smoke_tests='^(EQ and Drive layouts stay separated in both skins and all supported scales|Performance dialogs.*|Line meter readouts and scales follow the palette after warming their cache|Preset menu uses editor scale and remains anchored to its button|CLAP .*([Dd][Pp][Ii]|fractional).*)$'
          ctest --output-on-failure --output-junit test-layout-results.xml -R "$ui_smoke_tests"
          ctest --output-on-failure --output-junit test-results.xml -E "$ui_smoke_tests"

      - name: Summarize test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python3 tools/validation/report_ctest.py --build-dir "${{ env.BUILD_DIR }}"

      - name: Upload test diagnostics
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.BUILD_DIR }}/test-layout-results.xml
            ${{ env.BUILD_DIR }}/test-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTestsFailed.log

      - name: Read in .env from CMake # see GitHubENV.cmake
        shell: bash
        run: |
          cat .env # show us the config
          cat .env >> $GITHUB_ENV # pull in our PRODUCT_NAME, etc

      - name: Set additional env vars for next steps
        shell: bash
        run: |
          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "VST3_PATH=$ARTIFACTS_PATH/VST3/${{ env.PRODUCT_NAME }}.vst3" >> $GITHUB_ENV
          echo "AU_PATH=$ARTIFACTS_PATH/AU/${{ env.PRODUCT_NAME }}.component" >> $GITHUB_ENV
          echo "AUV3_PATH=$ARTIFACTS_PATH/AUv3/${{ env.PRODUCT_NAME }}.appex" >> $GITHUB_ENV
          echo "CLAP_PATH=$ARTIFACTS_PATH/CLAP/${{ env.PRODUCT_NAME }}.clap" >> $GITHUB_ENV
          echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}.app" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ env.PRODUCT_NAME }}-${{ env.VERSION }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Pluginval
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macOS" ]; then
            echo "Running pluginval on macOS with --skip-gui-tests"
            ${{ matrix.pluginval-binary }} --strictness-level 10 --timeout-ms "${{ env.PLUGINVAL_TIMEOUT_MS }}" --skip-gui-tests --verbose --validate "${{ env.VST3_PATH }}"
          else
            echo "Running pluginval normally on ${{ matrix.name }}"
            ${{ matrix.pluginval-binary }} --strictness-level 10 --timeout-ms "${{ env.PLUGINVAL_TIMEOUT_MS }}" --verbose --validate "${{ env.VST3_PATH }}"
          fi

      - name: Audio Unit load and state validation
        id: au_validation
        if: ${{ matrix.name == 'macOS' }}
        run: |
          python3 -m unittest discover -s tools/validation -p 'test_validate_au.py' -v
          au_log_dir="$RUNNER_TEMP/fire-au-validation"
          mkdir -p "$au_log_dir"
          xcrun clang++ -std=c++17 tools/validation/AuRegistryProbe.cpp \
            -framework AudioToolbox -framework CoreFoundation \
            -o "$RUNNER_TEMP/fire-au-registry-probe" > "$au_log_dir/probe-build.log" 2>&1
          # Copying a bundle does not synchronously publish it in the AU registry.
          # Refresh only this disposable runner user's registrar, then wait for
          # the exact component identity and version in fresh probe processes.
          installed_au="$HOME/Library/Audio/Plug-Ins/Components/${{ env.PRODUCT_NAME }}.component"
          mkdir -p "$(dirname "$installed_au")"
          ditto "$AU_PATH" "$installed_au"
          codesign --verify --deep --strict "$installed_au" 2>&1 | tee "$au_log_dir/signature.log"
          touch "$(dirname "$installed_au")"
          killall -u "$(id -un)" AudioComponentRegistrar > "$au_log_dir/registrar-refresh.log" 2>&1 || true
          python3 tools/validation/validate_au.py --bundle "$installed_au" --version "$VERSION" \
            --probe "$RUNNER_TEMP/fire-au-registry-probe" \
            --pluginval "pluginval.app/Contents/MacOS/pluginval" --log-dir "$au_log_dir" \
            --registration-timeout 60 --validation-timeout-ms "${{ env.PLUGINVAL_TIMEOUT_MS }}"

      - name: Upload AU validation diagnostics
        if: ${{ !cancelled() && (steps.au_validation.outcome == 'success' || steps.au_validation.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: au-validation-macOS
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/fire-au-validation/

      - name: Verify macOS bundle signatures
        if: ${{ matrix.name == 'macOS' }}
        run: |
          # Bundle icons are already embedded by CMake. Finder resource forks
          # added after signing are rejected by codesign's strict validation.
          codesign --verify --deep --strict "${{ env.VST3_PATH }}"
          codesign --verify --deep --strict "${{ env.AU_PATH }}"
          codesign --verify --deep --strict "${{ env.CLAP_PATH }}"

      - name: Zip (Windows)
        if: ${{ matrix.name == 'Windows' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" VST3/ CLAP/

      - name: Zip (macOS)
        if: ${{ matrix.name == 'macOS' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" VST3/ AU/ CLAP/

      - name: Zip (Linux)
        if: ${{ matrix.name == 'Linux' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" "-xr!lib${{ env.PRODUCT_NAME }}_SharedCode.a" .

      - name: Developer ID sign and notarize macOS release
        if: ${{ matrix.name == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.FIRE_MACOS_NOTARIZE == 'true' }}
        timeout-minutes: 40
        env:
          FIRE_MACOS_CERTIFICATE_BASE64: ${{ secrets.FIRE_MACOS_CERTIFICATE_BASE64 }}
          FIRE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FIRE_MACOS_CERTIFICATE_PASSWORD }}
          FIRE_MACOS_SIGNING_IDENTITY: ${{ secrets.FIRE_MACOS_SIGNING_IDENTITY }}
          FIRE_NOTARY_KEY_BASE64: ${{ secrets.FIRE_NOTARY_KEY_BASE64 }}
          FIRE_NOTARY_KEY_ID: ${{ secrets.FIRE_NOTARY_KEY_ID }}
          FIRE_NOTARY_ISSUER_ID: ${{ secrets.FIRE_NOTARY_ISSUER_ID }}
        run: packaging/sign-and-notarize-macos.sh "$ARTIFACTS_PATH" "$ARTIFACTS_PATH/$ARTIFACT_NAME.zip"

      - name: Upload notarization receipt
        if: ${{ matrix.name == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.FIRE_MACOS_NOTARIZE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macOS-notarization-receipt
          path: "${{ env.ARTIFACTS_PATH }}/notarization-receipt.json"

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.zip"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write

    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          # download-artifact puts these files in their own dirs...
          # Using globs sidesteps having to pass the version around
          files: |
            */*.exe
            */*.zip
            */*.dmg
